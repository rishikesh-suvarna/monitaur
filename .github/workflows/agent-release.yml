name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'New version to release, vMAJOR.MINOR.PATCH (e.g. v1.2.3). The tag must not exist yet.'
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  version:
    name: Validate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Resolve and validate version
      id: version
      env:
        # Passed through env and never interpolated into the script, so a
        # crafted dispatch input cannot inject shell.
        EVENT_NAME: ${{ github.event_name }}
        INPUT_VERSION: ${{ inputs.version }}
        TAG_NAME: ${{ github.ref_name }}
      run: |
        VERSION_RE='^v[0-9]+\.[0-9]+\.[0-9]+$'

        if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
          VERSION="$INPUT_VERSION"
        else
          VERSION="$TAG_NAME"
        fi

        if [[ ! "$VERSION" =~ $VERSION_RE ]]; then
          echo "::error::version must match vMAJOR.MINOR.PATCH (for example v1.2.3)"
          exit 1
        fi

        # A manual run creates the tag at the commit it builds. Refusing an
        # existing tag means a dispatch can never re-point a published
        # release at different binaries.
        if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
          existing="$(git ls-remote --tags origin "refs/tags/$VERSION")"
          if [ -n "$existing" ]; then
            echo "::error::tag $VERSION already exists, pick a new version"
            exit 1
          fi
        fi

        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  test:
    name: Vet and test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: agent/go.mod
        cache-dependency-path: agent/go.sum

    - name: Vet and test
      working-directory: ./agent
      run: |
        go vet ./...
        go test ./...

  build:
    name: Build Binaries
    needs: [version, test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: agent/go.mod
        cache-dependency-path: agent/go.sum

    - name: Set package name
      id: package
      run: |
        PACKAGE_NAME="monitaur-agent_${VERSION}_${GOOS}_${GOARCH}"
        echo "PACKAGE_NAME=${PACKAGE_NAME}" >> "$GITHUB_OUTPUT"

        if [ "$GOOS" = "windows" ]; then
          echo "ASSET_NAME=${PACKAGE_NAME}.zip" >> "$GITHUB_OUTPUT"
          echo "BINARY_NAME=monitaur-agent.exe" >> "$GITHUB_OUTPUT"
        else
          echo "ASSET_NAME=${PACKAGE_NAME}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "BINARY_NAME=monitaur-agent" >> "$GITHUB_OUTPUT"
        fi

    - name: Build binary
      working-directory: ./agent
      env:
        PACKAGE_NAME: ${{ steps.package.outputs.PACKAGE_NAME }}
        BINARY_NAME: ${{ steps.package.outputs.BINARY_NAME }}
      run: |
        go build -ldflags="-s -w -X main.Version=${VERSION}" -o "$BINARY_NAME" .

        mkdir -p "$PACKAGE_NAME"
        cp "$BINARY_NAME" "$PACKAGE_NAME/"
        cp config.json.example "$PACKAGE_NAME/"

        cat > "$PACKAGE_NAME/README.md" << 'EOF'
        # Monitaur Agent

        Server monitoring agent for Monitaur.

        ## Quick Start

        1. Copy the configuration template:
           ```bash
           cp config.json.example config.json
           ```

        2. Edit `config.json` with your server token from the Monitaur dashboard

        3. Run the agent:
           ```bash
           ./${{ steps.package.outputs.BINARY_NAME }}
           ```

        ## Installation as Service (Linux)

        ```bash
        sudo ./install.sh
        ```

        Or by hand:

        ```bash
        # Create the service user
        sudo useradd -r -s /bin/false monitaur

        # Copy binary to system path
        sudo install -m 0755 ${{ steps.package.outputs.BINARY_NAME }} /usr/local/bin/monitaur-agent

        # Config holds the server token: readable by root and monitaur only
        sudo install -d -m 0750 -o monitaur -g monitaur /etc/monitaur
        sudo install -m 0600 -o monitaur -g monitaur config.json /etc/monitaur/config.json

        # Create systemd service
        sudo tee /etc/systemd/system/monitaur-agent.service > /dev/null <<'SERVICEEOF'
        [Unit]
        Description=Monitaur Server Monitoring Agent
        After=network.target

        [Service]
        Type=simple
        User=monitaur
        WorkingDirectory=/etc/monitaur
        ExecStart=/usr/local/bin/monitaur-agent
        Restart=always
        RestartSec=5

        [Install]
        WantedBy=multi-user.target
        SERVICEEOF

        # Start service
        sudo systemctl daemon-reload
        sudo systemctl enable --now monitaur-agent
        ```

        ## Configuration

        Edit `config.json`:

        ```json
        {
          "token": "your-server-token-here",
          "api_endpoint": "wss://your-domain.com/agent/connect",
          "collection_interval": 5,
          "server_name": "my-server",
          "alert_thresholds": {
            "cpu": 80,
            "memory": 85,
            "disk": 90
          }
        }
        ```

        ## Commands

        ```bash
        # Show version
        ./${{ steps.package.outputs.BINARY_NAME }} -version

        # Show help
        ./${{ steps.package.outputs.BINARY_NAME }} -help

        # Create sample config
        ./${{ steps.package.outputs.BINARY_NAME }} -init
        ```
        EOF

        # The package installer needs systemd and useradd, so Linux only
        # (the top-level install.sh refuses macOS for the same reason).
        if [ "$GOOS" = "linux" ]; then
          cat > "$PACKAGE_NAME/install.sh" << 'EOF'
        #!/bin/sh

        # Installs the Monitaur Agent from this extracted release package.
        # Verify the downloaded archive before extracting it:
        #   sha256sum -c --ignore-missing SHA256SUMS

        set -eu
        # Everything this script creates is private unless a mode is given explicitly.
        umask 077

        INSTALL_DIR="/usr/local/bin"
        CONFIG_DIR="/etc/monitaur"
        SERVICE_DIR="/etc/systemd/system"
        BINARY_NAME="monitaur-agent"
        SERVICE_NAME="monitaur-agent"
        SERVICE_USER="monitaur"

        log() { printf '%s\n' "$*"; }
        die() { printf 'ERROR: %s\n' "$*" >&2; exit 1; }

        log "Installing Monitaur Agent..."

        if [ "$(id -u)" -ne 0 ]; then
            die "please run as root (use sudo)"
        fi

        for cmd in install systemctl useradd; do
            command -v "$cmd" >/dev/null 2>&1 || die "required command not found: $cmd"
        done

        SRC_DIR="$(cd "$(dirname "$0")" && pwd)"
        TMP="$(mktemp -d)"
        trap 'rm -rf "$TMP"' EXIT
        # Turn signals into a normal exit so the EXIT trap cleans up in every shell.
        trap 'exit 1' HUP INT TERM

        # --- Shared install steps: identical in install.sh and in the package
        # --- install.sh that .github/workflows/agent-release.yml generates.
        [ -f "$SRC_DIR/$BINARY_NAME" ] || die "$BINARY_NAME not found in $SRC_DIR"

        log "Creating service user..."
        if id "$SERVICE_USER" >/dev/null 2>&1; then
            log "User '$SERVICE_USER' already exists"
        else
            useradd -r -s /bin/false "$SERVICE_USER"
            log "Created user '$SERVICE_USER'"
        fi

        log "Installing binary..."
        [ -d "$INSTALL_DIR" ] || install -d -m 0755 "$INSTALL_DIR"
        # Write next to the target, then rename over it: a running agent keeps its
        # old inode (no "text file busy") and the path never shows a partial file.
        install -m 0755 "$SRC_DIR/$BINARY_NAME" "$INSTALL_DIR/.$BINARY_NAME.new"
        mv -f "$INSTALL_DIR/.$BINARY_NAME.new" "$INSTALL_DIR/$BINARY_NAME"

        log "Setting up configuration..."
        # The config holds the server token: root owns it, the service user may only read it.
        CONFIG_FILE="$CONFIG_DIR/config.json"
        mkdir -p "$CONFIG_DIR"
        chown "root:$SERVICE_USER" "$CONFIG_DIR"
        chmod 0750 "$CONFIG_DIR"
        # CONFIG_DIR is root-owned, so the service user cannot plant files in it;
        # refuse a symlink anyway rather than follow it as root.
        if [ -L "$CONFIG_FILE" ]; then
            die "$CONFIG_FILE is a symlink, refusing to touch it"
        fi
        if [ -f "$CONFIG_FILE" ]; then
            log "Config already exists at $CONFIG_FILE"
        else
            if [ -f "$SRC_DIR/config.json.example" ]; then
                cp "$SRC_DIR/config.json.example" "$TMP/config.json"
            else
                cat > "$TMP/config.json" << 'CONFIGEOF'
        {
          "token": "your-server-token-here",
          "api_endpoint": "wss://your-domain.com/agent/connect",
          "collection_interval": 5,
          "server_name": "",
          "alert_thresholds": {
            "cpu": 80,
            "memory": 85,
            "disk": 90
          }
        }
        CONFIGEOF
            fi
            install -m 0640 -o root -g "$SERVICE_USER" "$TMP/config.json" "$CONFIG_FILE"
            log "Created config template at $CONFIG_FILE"
        fi
        # Also fixes ownership and mode of a config an older installer wrote.
        chown "root:$SERVICE_USER" "$CONFIG_FILE"
        chmod 0640 "$CONFIG_FILE"

        log "Installing systemd service..."
        cat > "$TMP/$SERVICE_NAME.service" << 'SERVICEEOF'
        [Unit]
        Description=Monitaur Server Monitoring Agent
        After=network.target

        [Service]
        Type=simple
        User=monitaur
        WorkingDirectory=/etc/monitaur
        ExecStart=/usr/local/bin/monitaur-agent
        Restart=always
        RestartSec=5
        StandardOutput=journal
        StandardError=journal

        [Install]
        WantedBy=multi-user.target
        SERVICEEOF
        install -m 0644 "$TMP/$SERVICE_NAME.service" "$SERVICE_DIR/$SERVICE_NAME.service"

        systemctl daemon-reload
        # Restarts only a unit that is already running: an upgrade picks up the new
        # binary, a fresh install stays stopped until the config has a token.
        systemctl try-restart "$SERVICE_NAME"

        # Run the installed copy as the service user, the way systemd will.
        if command -v runuser >/dev/null 2>&1 \
            && INSTALLED_VERSION="$(runuser -u "$SERVICE_USER" -- "$INSTALL_DIR/$BINARY_NAME" -version 2>/dev/null)"; then
            log "$INSTALLED_VERSION installed successfully!"
        else
            log "Installed $BINARY_NAME to $INSTALL_DIR/$BINARY_NAME"
        fi
        # --- End of shared install steps.

        log ""
        log "Next steps:"
        log "1. Edit configuration: sudo nano $CONFIG_DIR/config.json"
        log "2. Add your server token from the Monitaur dashboard"
        log "3. Start and enable the service: sudo systemctl enable --now $SERVICE_NAME"
        log "4. Check status: sudo systemctl status $SERVICE_NAME"
        EOF
          chmod +x "$PACKAGE_NAME/install.sh"
        fi

    - name: Create archive
      working-directory: ./agent
      env:
        PACKAGE_NAME: ${{ steps.package.outputs.PACKAGE_NAME }}
        ASSET_NAME: ${{ steps.package.outputs.ASSET_NAME }}
      run: |
        if [ "$GOOS" = "windows" ]; then
          zip -r "$ASSET_NAME" "$PACKAGE_NAME"
        else
          tar -czf "$ASSET_NAME" "$PACKAGE_NAME"
        fi

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.package.outputs.ASSET_NAME }}
        path: ./agent/${{ steps.package.outputs.ASSET_NAME }}

  release:
    name: Create Release
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./release-assets
        merge-multiple: true

    - name: Generate SHA256SUMS
      working-directory: ./release-assets
      run: |
        shopt -s nullglob
        archives=( *.tar.gz *.zip )
        if [ "${#archives[@]}" -eq 0 ]; then
          echo "::error::no release archives found"
          exit 1
        fi
        sha256sum -- "${archives[@]}" > SHA256SUMS
        cat SHA256SUMS

    - name: Create Release
      uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
      with:
        tag_name: ${{ needs.version.outputs.version }}
        # Tag the commit these binaries were built from. Without it a manual
        # run would tag the default branch head instead.
        target_commitish: ${{ github.sha }}
        name: Monitaur Agent ${{ needs.version.outputs.version }}
        body: |
          ## Monitaur Agent ${{ needs.version.outputs.version }}

          ### Installation

          **Quick Install (Linux):**
          ```bash
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/${{ needs.version.outputs.version }}/install.sh | sudo bash -s ${{ needs.version.outputs.version }}
          ```
          The installer checks the archive against `SHA256SUMS` before extracting it.

          **Manual Installation:**
          1. Download the archive for your platform and `SHA256SUMS` below
          2. Verify it: `sha256sum -c --ignore-missing SHA256SUMS`
          3. Extract the archive
          4. Run `sudo ./install.sh` (Linux) or follow the README instructions

          ### Supported Platforms
          - Linux (AMD64, ARM64)
          - macOS (Intel, Apple Silicon)
          - Windows (AMD64)

          ### What's Changed
          - Server monitoring with real-time metrics
          - CPU, Memory, Disk, and Network monitoring
          - Configurable alert thresholds
          - WebSocket connection to Monitaur dashboard
          - Systemd service support (Linux)

          Full documentation: https://github.com/${{ github.repository }}
        files: ./release-assets/*
        fail_on_unmatched_files: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
