name: Deploy Monitaur Backend

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch:

# Two quick pushes must not interleave install/restart steps on the VM.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  STAGING_DIR: /tmp/monitaur-backend-deploy
  INSTALL_PATH: /usr/local/bin/monitaur-backend
  SERVICE_NAME: monitaur-backend
  HEALTH_URL: http://localhost:8080/health
  JOURNAL_DIR: /var/lib/monitaur/journal

jobs:
  deploy:
    name: Build and Deploy to Ubuntu Server
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version-file: backend/go.mod
        cache-dependency-path: backend/go.sum

    - name: Vet and test
      working-directory: ./backend
      run: |
        go vet ./...
        go test ./...

    - name: Build backend binary
      working-directory: ./backend
      run: |
        # CGO off gives a static binary, so the VM's glibc version cannot
        # break a binary built on a newer runner image.
        GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -trimpath -o monitaur-backend .
        ls -la monitaur-backend
        file monitaur-backend
        sha256sum monitaur-backend | tee monitaur-backend.sha256

    - name: Copy binary to server
      uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.PORT }}
        # Empty secret = no host key check; set it to pin the VM's key.
        fingerprint: ${{ secrets.HOST_FINGERPRINT }}
        source: "backend/monitaur-backend,backend/monitaur-backend.sha256"
        target: ${{ env.STAGING_DIR }}
        # Strips the leading "backend/" so files land directly in STAGING_DIR.
        # The previous "./backend/..." source counted "." as the first
        # component, so the binary landed in /tmp/backend/ and was never
        # installed. The install step below verifies the path and checksum.
        strip_components: 1
        rm: true

    - name: Install, restart, health check (rolls back on failure)
      uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.PORT }}
        # Empty secret = no host key check; set it to pin the VM's key.
        fingerprint: ${{ secrets.HOST_FINGERPRINT }}
        script: |
          set -eu

          STAGING_DIR="${{ env.STAGING_DIR }}"
          INSTALL_PATH="${{ env.INSTALL_PATH }}"
          SERVICE_NAME="${{ env.SERVICE_NAME }}"
          HEALTH_URL="${{ env.HEALTH_URL }}"
          JOURNAL_DIR="${{ env.JOURNAL_DIR }}"
          NEW_BIN="$STAGING_DIR/monitaur-backend"
          PREV_BIN="$INSTALL_PATH.prev"
          HEALTH_ATTEMPTS=15
          HEALTH_INTERVAL_SECONDS=2

          # Atomic swap: install next to the target, then rename over it.
          # Safe while the old binary is running (no "text file busy").
          swap_in() {
            sudo install -m 0755 -o root -g root "$1" "$INSTALL_PATH.new"
            sudo mv -f "$INSTALL_PATH.new" "$INSTALL_PATH"
          }

          is_healthy() {
            i=0
            while [ "$i" -lt "$HEALTH_ATTEMPTS" ]; do
              if sudo systemctl is-active --quiet "$SERVICE_NAME" \
                && curl -fsS --max-time 2 "$HEALTH_URL" >/dev/null; then
                return 0
              fi
              i=$((i + 1))
              sleep "$HEALTH_INTERVAL_SECONDS"
            done
            return 1
          }

          if [ ! -f "$NEW_BIN" ]; then
            echo "ERROR: new binary not found at $NEW_BIN. Staging dir contains:"
            ls -la "$STAGING_DIR" || true
            exit 1
          fi
          (cd "$STAGING_DIR" && sha256sum -c monitaur-backend.sha256)

          # v2 keeps a crash journal of unflushed metric rollups here
          # (metrics.journal_dir); the service user must be able to write it.
          SVC_USER="$(sudo systemctl show -p User --value "$SERVICE_NAME" 2>/dev/null || true)"
          [ -n "$SVC_USER" ] || SVC_USER=root
          sudo install -d -m 0750 -o "$SVC_USER" "$JOURNAL_DIR"

          if [ -f "$INSTALL_PATH" ]; then
            echo "Keeping current binary as $PREV_BIN"
            sudo cp -p "$INSTALL_PATH" "$PREV_BIN"
          fi

          echo "Installing new binary"
          swap_in "$NEW_BIN"
          sudo systemctl restart "$SERVICE_NAME"

          if is_healthy; then
            echo "Deployed: $(sha256sum "$INSTALL_PATH" | cut -d' ' -f1)"
            rm -rf "$STAGING_DIR"
            exit 0
          fi

          echo "ERROR: new binary failed health check. Recent logs:"
          sudo journalctl -u "$SERVICE_NAME" --no-pager -n 50 || true

          if [ -f "$PREV_BIN" ]; then
            echo "Rolling back to previous binary"
            swap_in "$PREV_BIN"
            sudo systemctl restart "$SERVICE_NAME"
            if is_healthy; then
              echo "Rollback succeeded; previous binary is serving"
            else
              echo "ERROR: rollback also failed health check, service is DOWN"
            fi
          else
            echo "ERROR: no previous binary to roll back to"
          fi
          exit 1
