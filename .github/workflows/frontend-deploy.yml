name: Deploy Monitaur Frontend

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-deploy.yml'
  workflow_dispatch:

# Two quick pushes must not interleave swap steps on the VM.
concurrency:
  group: deploy-frontend
  cancel-in-progress: false

permissions:
  contents: read

env:
  WEB_ROOT: /var/www/monitaur
  # Releases live next to WEB_ROOT (same filesystem), so swapping one in is a
  # rename, not a copy. Every run and every re-run attempt gets its own
  # staging and release directory, so a rollback can only ever restore the
  # backup taken by this run.
  RELEASES_DIR: /var/www/monitaur-releases
  RELEASE_ID: ${{ github.run_id }}-${{ github.run_attempt }}
  STAGING_DIR: /tmp/monitaur-frontend-${{ github.run_id }}-${{ github.run_attempt }}
  ARCHIVE_NAME: frontend-build.tar.gz

jobs:
  deploy:
    name: Build and Deploy Frontend
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: yarn
        cache-dependency-path: frontend/yarn.lock

    - name: Install dependencies
      working-directory: ./frontend
      # yarn.lock is Yarn 1, which silently ignores --immutable.
      run: yarn install --frozen-lockfile

    - name: Build frontend
      working-directory: ./frontend
      env:
        # Set production environment variables
        NODE_ENV: production
        VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
        VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
        VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
        VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
        VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        VITE_APP_SERVER_URL: ${{ vars.VITE_APP_SERVER_URL }}
        VITE_APP_SERVER_WS_URL: ${{ vars.VITE_APP_SERVER_WS_URL }}
        # Optional: enables Firebase App Check in the dashboard when set.
        VITE_FIREBASE_APPCHECK_SITE_KEY: ${{ secrets.VITE_FIREBASE_APPCHECK_SITE_KEY }}
      run: |
        yarn build
        ls -la dist/
        du -sh dist/

    - name: Create deployment archive
      working-directory: ./frontend
      run: |
        tar -czf "$ARCHIVE_NAME" -C dist .
        sha256sum "$ARCHIVE_NAME" | tee "$ARCHIVE_NAME.sha256"

    - name: Copy build to server
      id: upload
      uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.PORT }}
        fingerprint: ${{ secrets.HOST_FINGERPRINT }}
        source: "frontend/${{ env.ARCHIVE_NAME }},frontend/${{ env.ARCHIVE_NAME }}.sha256"
        target: ${{ env.STAGING_DIR }}
        # Strips the leading "frontend/" so both files land directly in
        # STAGING_DIR. The old "./frontend/..." source counted "." as the
        # first component, which is why the archive used to land in
        # /tmp/frontend/. The deploy step verifies the path and checksum.
        strip_components: 1
        rm: true

    - name: Deploy frontend
      id: deploy
      uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.PORT }}
        fingerprint: ${{ secrets.HOST_FINGERPRINT }}
        script: |
          set -eu

          WEB_ROOT="${{ env.WEB_ROOT }}"
          STAGING_DIR="${{ env.STAGING_DIR }}"
          ARCHIVE_NAME="${{ env.ARCHIVE_NAME }}"
          RELEASE_DIR="${{ env.RELEASES_DIR }}/${{ env.RELEASE_ID }}"
          NEW_ROOT="$RELEASE_DIR/new"
          PREV_ROOT="$RELEASE_DIR/prev"

          if [ ! -f "$STAGING_DIR/$ARCHIVE_NAME" ]; then
            echo "ERROR: $STAGING_DIR/$ARCHIVE_NAME not found. Staging dir contains:"
            ls -la "$STAGING_DIR" || true
            exit 1
          fi
          (cd "$STAGING_DIR" && sha256sum -c "$ARCHIVE_NAME.sha256")

          # RELEASE_DIR is unique per run attempt, so it is always fresh here
          # and the rollback step can trust what it finds inside.
          # Unpack as the SSH user rather than root, then hand it to nginx.
          sudo mkdir -p "$RELEASE_DIR"
          sudo install -d -m 0755 -o "$(id -un)" "$NEW_ROOT"
          tar -xzf "$STAGING_DIR/$ARCHIVE_NAME" -C "$NEW_ROOT"
          if [ ! -f "$NEW_ROOT/index.html" ]; then
            echo "ERROR: index.html missing from the build archive"
            exit 1
          fi
          sudo find "$NEW_ROOT" -type d -exec chmod 755 {} +
          sudo find "$NEW_ROOT" -type f -exec chmod 644 {} +
          sudo chown -R www-data:www-data "$NEW_ROOT"

          # Two renames on one filesystem: WEB_ROOT is missing only between
          # them, and the previous release stays in PREV_ROOT for rollback.
          if [ -e "$WEB_ROOT" ]; then
            sudo mv -T "$WEB_ROOT" "$PREV_ROOT"
          fi
          sudo mv -T "$NEW_ROOT" "$WEB_ROOT"

          echo "Deployed release ${{ env.RELEASE_ID }} to $WEB_ROOT"
          if [ -e "$PREV_ROOT" ]; then
            echo "Previous release kept at $PREV_ROOT"
          fi

    - name: Test Nginx configuration and reload
      uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.PORT }}
        fingerprint: ${{ secrets.HOST_FINGERPRINT }}
        script: |
          set -eu

          echo "Testing Nginx configuration..."

          if sudo nginx -t; then
            echo "Nginx configuration is valid"

            # Reload also drops any open_file_cache entries for the old release.
            echo "Reloading Nginx..."
            sudo systemctl reload nginx

            if sudo systemctl is-active --quiet nginx; then
              echo "Nginx is running"
            else
              echo "Nginx is not running!"
              sudo systemctl status nginx --no-pager -l
              exit 1
            fi
          else
            echo "Nginx configuration test failed!"
            exit 1
          fi

    - name: Test frontend deployment
      uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.PORT }}
        fingerprint: ${{ secrets.HOST_FINGERPRINT }}
        script: |
          set -eu

          WEB_ROOT="${{ env.WEB_ROOT }}"

          echo "Testing frontend deployment..."

          if curl -f -s http://localhost/ >/dev/null; then
            echo "Frontend accessible locally"
          else
            echo "Frontend not accessible locally"
          fi

          if curl -f -s -k https://localhost/ >/dev/null; then
            echo "Frontend accessible via HTTPS"
          else
            echo "Frontend not accessible via HTTPS"
          fi

          echo "Frontend files verification:"
          for file in index.html assets/; do
            if [ -e "$WEB_ROOT/$file" ]; then
              echo "$file exists"
            else
              echo "$file missing"
            fi
          done

    - name: Roll back failed deploy
      # Only the deploy step touches the live site. A failed install, build
      # or upload never changed it, so there is nothing to restore then.
      if: failure() && steps.deploy.outcome == 'failure'
      uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.PORT }}
        fingerprint: ${{ secrets.HOST_FINGERPRINT }}
        script: |
          set -eu

          WEB_ROOT="${{ env.WEB_ROOT }}"
          RELEASE_DIR="${{ env.RELEASES_DIR }}/${{ env.RELEASE_ID }}"
          PREV_ROOT="$RELEASE_DIR/prev"

          # PREV_ROOT exists only once the first swap rename has happened,
          # so its presence is exactly "the live site was changed".
          if [ -e "$PREV_ROOT" ]; then
            echo "Restoring the previous release from $PREV_ROOT"
            if [ -e "$WEB_ROOT" ]; then
              sudo mv -T "$WEB_ROOT" "$RELEASE_DIR/failed"
            fi
            sudo mv -T "$PREV_ROOT" "$WEB_ROOT"
            sudo systemctl reload nginx
            echo "Rollback completed"
          else
            echo "The live site was not swapped, nothing to restore"
          fi

          sudo rm -rf "$RELEASE_DIR"

    - name: Cleanup deployment files
      # Also runs when a later step failed, so staging never piles up in /tmp.
      if: always() && steps.upload.outcome != 'skipped'
      uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.PORT }}
        fingerprint: ${{ secrets.HOST_FINGERPRINT }}
        script: |
          set -eu

          STAGING_DIR="${{ env.STAGING_DIR }}"
          RELEASES_DIR="${{ env.RELEASES_DIR }}"
          # Each release dir holds "prev", the site that was live before that
          # run. Keep the newest few for manual rollback.
          KEEP_RELEASES=3

          echo "Cleaning up deployment files..."
          rm -rf "$STAGING_DIR"

          if [ -d "$RELEASES_DIR" ]; then
            find "$RELEASES_DIR" -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' \
              | sort -rn \
              | tail -n +"$((KEEP_RELEASES + 1))" \
              | cut -d' ' -f2- \
              | xargs -r sudo rm -rf --
          fi

          echo "Cleanup completed"

    - name: Notify deployment status
      if: always()
      uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.PORT }}
        fingerprint: ${{ secrets.HOST_FINGERPRINT }}
        script: |
          set -eu

          JOB_STATUS="${{ job.status }}"

          echo "Final deployment status:"
          echo "Frontend URL: https://monitaur.rishikeshsuvarna.com"
          echo "Deployment path: ${{ env.WEB_ROOT }}"
          echo "Nginx status: $(sudo systemctl is-active nginx || true)"

          if [ "$JOB_STATUS" = "success" ]; then
            echo "Deployment completed successfully!"
          else
            echo "Deployment failed!"
          fi
